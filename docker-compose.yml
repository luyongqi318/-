services:
  hr:
    build: .
    image: doubletree-hr:latest
    container_name: doubletree-hr
    ports:
      - "3000:3000"
    environment:
      # 登录账号（务必修改）
      HR_USER: hr
      HR_PASS: doubletree2026
      AUTH_SECRET: change-me-to-a-long-random-string
      # 模型（可留空，留空走本地演示模式；也可在网页「系统设置」里填）
      DEEPSEEK_API_KEY: ""
      AGENT_MODEL: deepseek-chat
      AGENT_BASE_URL: https://api.deepseek.com
      HR_DB_PATH: /app/data/hr.db
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
