# Render Blueprint：https://render.com/docs/blueprint-spec
# 免费计划不支持持久磁盘，SQLite 数据会随重启丢失，建议 Starter 及以上
services:
  - type: web
    name: doubletree-hr
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: AGENT_MODEL
        value: deepseek-chat
      - key: AGENT_BASE_URL
        value: https://api.deepseek.com
      - key: HR_USER
        sync: false
      - key: HR_PASS
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: HR_DB_PATH
        value: /app/data/hr.db
    disk:
      name: hr-data
      mountPath: /app/data
      sizeGB: 1
